<style>.login-card {
    background-color: #121212;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    position: relative
    }
.login-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent)
    }
.bg-gold-gradient {
    background: linear-gradient(135deg, #f2ca50 0%, #d4af37 100%)
    }
.input-glow:focus {
    box-shadow: 0 0 12px rgba(212, 175, 55, 0.2)

<body class="bg-[#0A0A0A] font-body-md text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Subtle Background Elements -->
<div class="absolute inset-0 city-overlay z-0" data-alt="A sophisticated and moody panoramic shot of a modern city skyline at dusk, presented in deep charcoal and black tones. The image is highly stylized with high contrast and minimalist lighting, emphasizing the geometric silhouettes of skyscrapers and architectural structures. The atmosphere is quiet, executive, and technologically advanced, perfectly matching a premium dark-themed administrative dashboard aesthetic."></div>
<div class="absolute inset-0 bg-radial-gradient from-transparent to-[#0A0A0A] z-0"></div>
<!-- Main Content Canvas -->
<div class="relative z-10 w-full max-w-[440px] px-lg">
<!-- Branding Header -->
<div class="text-center mb-xl">
<div class="flex justify-center mb-md">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">
                    shield_person
                </span>
</div>
<h1 class="font-display text-primary uppercase tracking-widest mb-xs" style="font-size: 14px; font-weight: 900;">
                Mayor Intelligence Dashboard
            </h1>
<p class="font-body-sm text-on-surface-variant/60 tracking-tight">
                Secure Executive Portal
            </p>
</div>
<!-- Login Card -->
<div class="login-card rounded-xl p-xl flex flex-col gap-lg">
<div class="space-y-sm">
<h2 class="font-h2 text-on-surface">Executive Login</h2>
<p class="font-body-sm text-on-surface-variant">Please authenticate to access city insights.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md" onsubmit="return false;">
<div class="space-y-xs">
<label class="font-label-caps text-on-surface-variant block">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-body-md">mail</span>
<input class="w-full bg-[#080808] border-outline-variant/30 rounded-lg py-md pl-xl pr-md text-on-surface placeholder:text-on-surface-variant/30 focus:border-primary/50 focus:ring-0 transition-all input-glow font-body-sm" placeholder="mayor@cityhall.gov" type="email"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-caps text-on-surface-variant block">Security Credentials</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-body-md">lock</span>
<input class="w-full bg-[#080808] border-outline-variant/30 rounded-lg py-md pl-xl pr-md text-on-surface placeholder:text-on-surface-variant/30 focus:border-primary/50 focus:ring-0 transition-all input-glow font-body-sm" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center justify-between mt-xs">
<label class="flex items-center gap-sm cursor-pointer">
<input class="w-4 h-4 rounded border-outline-variant/50 bg-transparent text-primary focus:ring-0 focus:ring-offset-0" type="checkbox"/>
<span class="font-body-sm text-on-surface-variant/80">Remember device</span>
</label>
<a class="font-body-sm text-primary-container hover:text-primary transition-colors" href="#">Recover Access</a>
</div>
<button class="bg-gold-gradient w-full py-md rounded-lg font-h3 text-on-primary-fixed shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
<div class="relative flex items-center py-sm">
<div class="flex-grow border-t border-outline-variant/20"></div>
<span class="flex-shrink mx-md font-label-caps text-on-surface-variant/40">Secure SSO</span>
<div class="flex-grow border-t border-outline-variant/20"></div>
</div>
<!-- Google Login -->
<button class="w-full py-md rounded-lg border border-primary-container/30 hover:border-primary-container/60 bg-transparent font-body-md text-on-surface transition-all flex items-center justify-center gap-md hover:bg-white/5 active:scale-[0.98]">
<img alt="Google Logo" class="w-5 h-5" data-alt="The official multi-colored Google 'G' logo isolated on a clean white circle, appearing sharp and professionally rendered. The logo uses its signature blue, red, yellow, and green colors, representing high-standard digital integration and authentication services in a modern web environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDWVA_IU2Mt7rG4RtyhVand8z0LyJVwStgzYs_FChtE1PbdrQI6mj3k4Arm8kyqvfW_fIkHrXUfef5_1hfLNHyhvBXJNtv7ksCngsCxjPArRjjiHBSYxQ_m_U8Pi6uim7vcYfVjkdNfSKAM2dscRO2J5z_VZoMzNJpeCX6BAntVvZlYQ0FCd1DThqYCZBcEeO_TVMO3xUpSqEmhbuzfNllkDun1uZV_rYV1p3GLY0R_sAvnOkBj6dLpIYtYOC8K6ecOOgQ6QyoVfgRE"/>
<span>Continue with Google</span>
</button>
</div>
<!-- Footer Links -->
<div class="mt-xl flex justify-center gap-xl">
<a class="font-label-caps text-on-surface-variant/40 hover:text-on-surface transition-colors" href="#">Privacy Protocol</a>
<a class="font-label-caps text-on-surface-variant/40 hover:text-on-surface transition-colors" href="#">Support Desk</a>
<a class="font-label-caps text-on-surface-variant/40 hover:text-on-surface transition-colors" href="#">Terms of Service</a>
</div>
</div>
<!-- Status Decoration -->
<div class="fixed bottom-lg right-lg flex items-center gap-sm bg-white/5 backdrop-blur-sm px-md py-xs rounded-full border border-white/10">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<span class="font-mono-data text-[10px] text-on-surface-variant/60 uppercase tracking-widest">System Status: Operational</span>
</div>
